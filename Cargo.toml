[package]
name = "harnesscope"
version = "0.3.0-rc.2"
edition = "2021"
authors = ["Harnesscope Contributors"]
description = "Local cross-platform telemetry utility for AI coding agents"
license = "MIT"

[lib]
name = "harnesscope"
path = "src/lib.rs"

[[bin]]
name = "harnesscope"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
open = "5.3"
directories = "5.0"
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
mime_guess = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tempfile = "3.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
