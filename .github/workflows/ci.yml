name: CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-26, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build Web UI
        run: |
          cd web
          npm ci
          npm run build
          cd ..
        shell: bash

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --verbose

      - name: macOS installer syntax
        run: bash -n scripts/install-macos.sh
        shell: bash

      - name: Homebrew packaging tests
        run: python scripts/test_generate_homebrew.py

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo Test
        run: cargo test --all-targets --locked --verbose

      - name: Frontend dependency audit
        run: npm audit --audit-level=high
        working-directory: web

  binary-cask:
    name: Binary cask on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v7
      - name: Validate Ruby definitions and register local tap
        run: |
          ruby -c Formula/harnesscope.rb
          ruby -c Casks/harnesscope.rb
          brew tap harnesscope/packaging-smoke "$GITHUB_WORKSPACE"
      - name: Install binary without a usable Xcode developer directory
        env:
          DEVELOPER_DIR: /nonexistent/harnesscope-xcode-not-required
        run: |
          brew install --cask harnesscope/packaging-smoke/harnesscope
          harnesscope --version
          harnesscope --help
      - name: Remove test cask
        if: always()
        run: |
          if brew list --cask harnesscope/packaging-smoke/harnesscope >/dev/null 2>&1; then
            brew uninstall --cask harnesscope/packaging-smoke/harnesscope
          fi
