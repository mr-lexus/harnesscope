name: CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-26, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build Web UI
        run: |
          cd web
          npm ci
          npm run build
          cd ..
        shell: bash

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --verbose

      - name: macOS installer syntax
        run: bash -n scripts/install-macos.sh
        shell: bash

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo Test
        run: cargo test --all-targets --locked --verbose

      - name: Frontend dependency audit
        run: npm audit --audit-level=high
        working-directory: web
