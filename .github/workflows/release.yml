name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.2.2)'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_format: tar.gz
            bin_name: harnesscope

          - os: macos-26
            target: aarch64-apple-darwin
            archive_format: tar.gz
            bin_name: harnesscope

          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_format: tar.gz
            bin_name: harnesscope

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_format: zip
            bin_name: harnesscope.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set version variable
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_VERSION="$INPUT_VERSION"
          else
            RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Verify package versions match the release tag
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          version = os.environ["VERSION"].removeprefix("v")
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          web = json.loads(pathlib.Path("web/package.json").read_text())["version"]
          if cargo != version or web != version:
              raise SystemExit(f"Release {version} does not match Cargo {cargo} / web {web}")
          for name in ("docs/RELEASE.md", "docs/RELEASE.ru.md"):
              if pathlib.Path(name).read_text(encoding="utf-8").splitlines()[0] != f"# Harnesscope v{version}":
                  raise SystemExit(f"Update {name} for v{version} before releasing")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build Web UI
        shell: bash
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test the release binary
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          test "$("$BINARY" --version)" = "harnesscope ${VERSION#v}"
          "$BINARY" --help

      - name: Package artifact (Unix)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_NAME="harnesscope-${{ env.VERSION }}-${{ matrix.target }}.tar.gz"
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} ./
          tar -czf "$ARCHIVE_NAME" ${{ matrix.bin_name }} README.md README.ru.md docs \
            examples/events.jsonl examples/task-adapter.json install.sh install.ps1 \
            scripts/install-macos.sh scripts/install-local.ps1
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Package artifact (Windows)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}"
          $archive = "harnesscope-$ver-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Path package, package/examples, package/scripts | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" package/
          Copy-Item README.md, README.ru.md, install.sh, install.ps1 package/
          Copy-Item docs package/ -Recurse
          Copy-Item examples/events.jsonl, examples/task-adapter.json package/examples/
          Copy-Item scripts/install-macos.sh, scripts/install-local.ps1 package/scripts/
          Compress-Archive -Path package/* -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            harnesscope-${{ env.VERSION }}-${{ matrix.target }}.*

  publish:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set version variable
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_VERSION="$INPUT_VERSION"
          else
            RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Organize assets & create checksums
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > checksums.txt
          else
            shasum -a 256 * > checksums.txt
          fi
          cat checksums.txt
          cd ..

      - name: Prepare release notes with tag-specific documentation links
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          from urllib.parse import urljoin
          base = f"https://github.com/mr-lexus/harnesscope/blob/{os.environ['VERSION']}/docs/"
          notes = pathlib.Path("docs/RELEASE.md").read_text(encoding="utf-8")
          notes = re.sub(r"\]\(([^)]+)\)", lambda m: f"]({urljoin(base, m[1])})", notes)
          pathlib.Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Harnesscope ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          body_path: release-notes.md
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Homebrew formula and binary cask
        shell: bash
        run: python3 scripts/generate-homebrew.py --version "$VERSION" --checksums dist/checksums.txt

      - name: Update Homebrew Tap (stable releases, if PAT configured)
        if: ${{ !contains(env.VERSION, '-') }}
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::notice title=Homebrew tap sync skipped::Configure HOMEBREW_TAP_TOKEN (or GH_PAT) to enable automatic tap updates."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${TAP_TOKEN}@github.com/mr-lexus/homebrew-tap.git tap-repo
          mkdir -p tap-repo/Formula tap-repo/Casks
          cp Formula/harnesscope.rb tap-repo/Formula/harnesscope.rb
          cp Casks/harnesscope.rb tap-repo/Casks/harnesscope.rb
          cd tap-repo
          git add Formula/harnesscope.rb Casks/harnesscope.rb
          git commit -m "Update harnesscope formula to ${VERSION}" || echo "No changes"
          git push origin main

