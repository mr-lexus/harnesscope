name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.2.2)'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_format: tar.gz
            bin_name: harnesscope

          - os: macos-26
            target: aarch64-apple-darwin
            archive_format: tar.gz
            bin_name: harnesscope

          - os: macos-26-intel
            target: x86_64-apple-darwin
            archive_format: tar.gz
            bin_name: harnesscope

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_format: zip
            bin_name: harnesscope.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set version variable
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_VERSION="$INPUT_VERSION"
          else
            RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build Web UI
        shell: bash
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package artifact (Unix)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_NAME="harnesscope-${{ env.VERSION }}-${{ matrix.target }}.tar.gz"
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} ./
          tar -czf "$ARCHIVE_NAME" ${{ matrix.bin_name }} README.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Package artifact (Windows)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}"
          $archive = "harnesscope-$ver-${{ matrix.target }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "./${{ matrix.bin_name }}"
          Compress-Archive -Path "${{ matrix.bin_name }}", "README.md" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            harnesscope-${{ env.VERSION }}-${{ matrix.target }}.*

  publish:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set version variable
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_VERSION="$INPUT_VERSION"
          else
            RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Organize assets & create checksums
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist/ \;
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > checksums.txt
          else
            shasum -a 256 * > checksums.txt
          fi
          cat checksums.txt
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Harnesscope ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Homebrew formula and binary cask
        shell: bash
        run: python3 scripts/generate-homebrew.py --version "$VERSION" --checksums dist/checksums.txt

      - name: Update Homebrew Tap (stable releases, if PAT configured)
        if: ${{ !contains(env.VERSION, '-') }}
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::notice title=Homebrew tap sync skipped::Configure HOMEBREW_TAP_TOKEN (or GH_PAT) to enable automatic tap updates."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${TAP_TOKEN}@github.com/mr-lexus/homebrew-tap.git tap-repo
          mkdir -p tap-repo/Formula tap-repo/Casks
          cp Formula/harnesscope.rb tap-repo/Formula/harnesscope.rb
          cp Casks/harnesscope.rb tap-repo/Casks/harnesscope.rb
          cd tap-repo
          git add Formula/harnesscope.rb Casks/harnesscope.rb
          git commit -m "Update harnesscope formula to ${VERSION}" || echo "No changes"
          git push origin main

